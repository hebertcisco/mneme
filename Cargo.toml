[package]
name = "mneme"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Crash-safe shared-memory engine for a Markdown vault (Windows, Linux, macOS)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hebertcisco/mneme"
homepage = "https://github.com/hebertcisco/mneme"
documentation = "https://docs.rs/mneme"
keywords = ["memory", "markdown", "obsidian", "knowledge-graph", "cli"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["target/*"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
fs4 = "0.12"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mneme"
path = "src/main.rs"
